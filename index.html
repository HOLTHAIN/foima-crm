<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0F172A"/>
<title>FOIMA CRM</title>
<style>
:root{
  --bg:#F1F5F9;--surface:#FFFFFF;--surface2:#F8FAFC;
  --border:#E2E8F0;--border2:#CBD5E1;
  --text:#0F172A;--text2:#475569;--text3:#94A3B8;
  --primary:#1E40AF;--primary-light:#DBEAFE;--primary-dark:#1E3A8A;
  --green:#059669;--green-light:#D1FAE5;
  --amber:#D97706;--amber-light:#FEF3C7;
  --red:#DC2626;--red-light:#FEE2E2;
  --purple:#7C3AED;--purple-light:#EDE9FE;
  --radius:10px;--radius-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 4px 16px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);font-size:15px}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spin{animation:spin .7s linear infinite;display:inline-block}
#shell{display:flex;height:100vh;overflow:hidden}
#sidebar{width:220px;background:#0F172A;display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#sidebar.collapsed{width:60px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:20px}
.sidebar-logo{padding:16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.sidebar-logo-mark{width:32px;height:32px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0}
.sidebar-logo-text{color:#fff;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden}
.sidebar-logo-sub{color:rgba(255,255,255,.4);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.nav-section{padding:12px 14px 4px;color:rgba(255,255,255,.3);font-size:10px;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;margin:1px 6px;cursor:pointer;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap;overflow:hidden;border:none;background:none;width:calc(100% - 12px);text-align:left;font-family:inherit}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item svg{flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;flex-shrink:0}
.topbar-title{font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:700}
.page-sub{font-size:13px;color:var(--text3);margin-top:2px}
.card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow);border-left:3px solid var(--border);cursor:pointer}
.stat-card:hover{box-shadow:var(--shadow-lg)}
.stat-num{font-size:28px;font-weight:800;line-height:1}
.stat-label{font-size:12px;color:var(--text3);margin-top:4px}
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;background:var(--surface)}
thead{background:var(--surface2)}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.td-main{font-weight:600;color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-amber{background:var(--amber-light);color:var(--amber)}
.badge-red{background:var(--red-light);color:var(--red)}
.badge-blue{background:var(--primary-light);color:var(--primary)}
.badge-purple{background:var(--purple-light);color:var(--purple)}
.badge-gray{background:var(--bg);color:var(--text2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:none;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;white-space:nowrap;font-family:inherit}
.btn:active{opacity:.8}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:none;color:var(--text2);border:none;padding:6px 10px;font-family:inherit}
.btn-ghost:hover{background:var(--bg)}
.btn-icon{padding:7px;border-radius:8px}
.btn-sm{padding:5px 10px;font-size:12px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.form-control{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;color:var(--text);background:var(--surface);transition:border-color .15s;font-family:inherit}
.form-control:focus{border-color:var(--primary)}
.form-control[readonly]{background:var(--surface2);color:var(--text2)}
textarea.form-control{resize:vertical;min-height:80px}
.form-grid{display:grid;gap:12px}
.form-grid-2{grid-template-columns:1fr 1fr}
.form-section{font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;padding:10px 0 8px;border-bottom:1px solid var(--border);margin-bottom:12px;grid-column:1/-1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:fadeIn .2s ease}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-size:16px;font-weight:700}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--surface);position:sticky;bottom:0}
.fase-track{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.fase-step{flex:1;padding:10px 4px;text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;background:var(--bg);color:var(--text3);cursor:pointer;border-right:1px solid var(--border);transition:all .15s}
.fase-step:last-child{border-right:none}
.fase-step.done{background:var(--green-light);color:var(--green)}
.fase-step.active{background:var(--primary-light);color:var(--primary)}
.fase-step.blocked{background:var(--red-light);color:var(--red)}
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-icon{font-size:44px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:13px;margin-bottom:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter-btn{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit}
.filter-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
#toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:500;color:#fff;box-shadow:var(--shadow-lg);animation:fadeIn .2s ease;max-width:320px}
.toast-ok{background:#064E3B}
.toast-warn{background:#78350F}
.toast-err{background:#7F1D1D}
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0F172A 0%,#1E3A8A 100%);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.login-box{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:32px;width:100%;max-width:340px}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo-mark{width:56px;height:56px;background:var(--primary);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;margin-bottom:10px}
.login-title{color:#fff;font-size:22px;font-weight:800}
.login-sub{color:rgba(255,255,255,.5);font-size:13px;margin-top:4px}
.user-selector{display:grid;gap:8px;margin-bottom:16px}
.user-opt{padding:11px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;transition:all .15s;font-family:inherit;width:100%;text-align:left}
.user-opt:hover,.user-opt.selected{border-color:var(--primary);background:rgba(30,64,175,.3)}
.pin-wrap{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.pin-dot{width:44px;height:50px;border:1.5px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.05);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all .15s}
.pin-dot.filled{border-color:var(--primary);background:rgba(30,64,175,.3)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pin-key{padding:14px;border-radius:10px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:18px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.pin-key:hover{background:rgba(255,255,255,.12)}
.pin-key:active{transform:scale(.93);background:var(--primary)}
.pin-error{color:#FC8181;text-align:center;font-size:13px;margin-top:8px;min-height:18px}
.elem-table{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:6px}
.elem-hdr,.elem-row{display:grid;gap:4px;padding:5px 8px;align-items:center}
.elem-hdr{background:var(--surface2);font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase}
.elem-row{border-top:1px solid var(--border)}
@media(max-width:700px){
  #sidebar{display:flex;position:fixed;left:-220px;top:0;bottom:0;z-index:90;transition:left .25s;width:220px!important}
  #sidebar.mobile-open{left:0}
  #content{padding:12px}
  .form-grid-2{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr 1fr}
  #bottom-nav{display:flex}
  #main{padding-bottom:64px}
}
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:90;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav-inner{display:grid;grid-template-columns:repeat(5,1fr);max-width:600px;margin:0 auto}
.bnav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:none;background:none;font-size:9px;font-weight:500;color:var(--text3);cursor:pointer;font-family:inherit}
.bnav-btn.active{color:var(--primary)}
.bnav-btn svg{width:20px;height:20px}
</style>
</head>

<script>
const SB_URL="https://ougbxgwimznxkgnerlgr.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91Z2J4Z3dpbXpueGtnbmVybGdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MDEyNjMsImV4cCI6MjEwMDQ3NzI2M30.nwp402VkuWjLUu4ZmeKHFfxMRUfEEaHQkRx36Arhubc";
const HDR={"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY};
async function sbReq(table,method,body,query){
  const url=SB_URL+"/rest/v1/"+table+(query?"?"+query:"");
  const opts={method,headers:{...HDR,"Prefer":"return=representation"}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  if(!r.ok){const e=await r.text();throw new Error(e);}
  if(method==="DELETE"||r.status===204) return [];
  return r.json();
}
const sbGet=(t,q)=>sbReq(t,"GET",null,q);
const sbIns=(t,d)=>sbReq(t,"POST",d);
const sbUpd=(t,id,d)=>sbReq(t,"PATCH",d,"id=eq."+id);
const sbDel=(t,id)=>sbReq(t,"DELETE",null,"id=eq."+id);

let APP={user:null,page:"dashboard",data:{clientes:[],ots:[],presupuestos:[],catalogo:[],inventario:[],facturas:[],usuarios:[],elementos:[]},filters:{},params:{}};

const PHASES=[
  {id:"premontaje",label:"Premontaje",color:"#1E40AF"},
  {id:"hidraulica",label:"Hidráulica",color:"#059669"},
  {id:"electricidad",label:"Electricidad",color:"#D97706"},
  {id:"acabados",label:"Acabados",color:"#7C3AED"},
];

const OT_ESTADOS={
  pendiente:{label:"Pendiente",cls:"badge-gray"},
  en_curso:{label:"En curso",cls:"badge-blue"},

  completada:{label:"Completada",cls:"badge-green"},
  entregada:{label:"Entregada",cls:"badge-purple"},
};
const PRES_ESTADOS={
  borrador:{label:"Borrador",cls:"badge-gray"},
  enviado:{label:"Enviado",cls:"badge-blue"},
  aceptado:{label:"Aceptado",cls:"badge-green"},
  rechazado:{label:"Rechazado",cls:"badge-red"},
  caducado:{label:"Caducado",cls:"badge-amber"},

const FACT_ESTADOS={

  emitida:{label:"Emitida",cls:"badge-blue"},
  cobrada:{label:"Cobrada",cls:"badge-green"},
  vencida:{label:"Vencida",cls:"badge-red"},
};
const NAV=[
  {section:"Principal"},
  {id:"dashboard",label:"Dashboard",icon:'<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="1.8"/>'},
  {id:"ots",label:"Órdenes (OT)",icon:'<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'},
  {id:"clientes",label:"Clientes",icon:'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/>'},
  {section:"Comercial"},
  {id:"presupuestos",label:"Presupuestos",icon:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" stroke="currentColor" stroke-width="1.8"/><path d="M14 2v6h6M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'},
  {id:"facturas",label:"Facturación",icon:'<rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M2 10h20" stroke="currentColor" stroke-width="1.8"/>'},
  {section:"Producción"},
  {id:"catalogo",label:"Catálogo",icon:'<path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 014 22V3a1 1 0 011-1h14a1 1 0 011 1v14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'},
  {id:"inventario",label:"Inventario",icon:'<path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" stroke="currentColor" stroke-width="1.8"/>'},
  {id:"elementos",label:"Elementos",icon:'<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="currentColor" stroke-width="1.8"/>'},
  {section:"Análisis"},

function toast(msg,type="ok"){
  const c=document.getElementById("toast-container");
  const t=document.createElement("div");
  t.className="toast toast-"+type; t.textContent=msg; c.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}
function fmtDate(d){if(!d)return"—";return new Date(d).toLocaleDateString("es-ES");}
function fmtMoney(n){return Number(n||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";}
function statusBadge(est,map){const e=map[est]||{label:est,cls:"badge-gray"};return `<span class="badge ${e.cls}">${e.label}</span>`;}
function isAdmin(){return APP.user?.rol==="admin";}
function toggleSidebar(){
  const sb=document.getElementById("sidebar");
  const isMobile=window.innerWidth<=700;
  if(isMobile){
    if(sb.classList.contains("mobile-open")){
      sb.classList.remove("mobile-open");
      document.getElementById("sidebar-overlay").remove();
    } else {
      sb.classList.add("mobile-open");
      const ov=document.createElement("div");
      ov.id="sidebar-overlay";
      ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:89";
      ov.onclick=toggleSidebar;
      document.body.appendChild(ov);
    }
  } else {
    sb.classList.toggle("collapsed");
  }
}
function openModal(html){document.getElementById("modal-container").innerHTML=html;const ov=document.querySelector(".overlay");if(ov)ov.addEventListener("click",e=>{if(e.target===ov)closeModal();});}
function closeModal(){document.getElementById("modal-container").innerHTML="";}
function confirm2(msg,cb){
  openModal(`<div class="overlay"><div class="modal" style="max-width:360px">
    <div class="modal-header"><div class="modal-title">Confirmar</div></div>
    <div class="modal-body"><p style="font-size:14px">${msg}</p></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>

}

let pinBuf="",selUser=null;
async function initLogin(){
  try{APP.data.usuarios=await sbGet("usuarios","activo=eq.true&order=nombre");}
  catch{APP.data.usuarios=[{id:"a",nombre:"Admin",pin:"1234",rol:"admin"},{id:"b",nombre:"Producción",pin:"0000",rol:"viewer"}];}
  renderLogin();
}
function renderLogin(){
  const users=APP.data.usuarios;
  document.getElementById("user-selector").innerHTML=users.map(u=>`
    <button class="user-opt" id="uopt-${u.id}" onclick="selUserFn('${u.id}','${u.nombre}','${u.pin}','${u.rol}')">
      <div style="width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">${u.nombre[0]}</div>
      <div><div>${u.nombre}</div><div style="font-size:11px;color:rgba(255,255,255,.4)">${u.rol}</div></div>
    </button>`).join("");
  renderPinDisplay();
  document.getElementById("pin-pad").innerHTML=["1","2","3","4","5","6","7","8","9","⌫","0","✓"].map(k=>`<button class="pin-key" onclick="pinKey('${k}')">${k}</button>`).join("");
}
function selUserFn(id,nombre,pin,rol){
  selUser={id,nombre,pin,rol}; pinBuf="";
  document.querySelectorAll(".user-opt").forEach(b=>b.classList.remove("selected"));
  const el=document.getElementById("uopt-"+id); if(el) el.classList.add("selected");
  renderPinDisplay(); document.getElementById("pin-error").textContent="";
}
function renderPinDisplay(){
  document.getElementById("pin-display").innerHTML=Array(4).fill(0).map((_,i)=>`
    <div class="pin-dot ${pinBuf.length>i?"filled":""}">${pinBuf.length>i?"●":""}</div>`).join("");
}
function pinKey(k){
  if(!selUser){toast("Selecciona un usuario","warn");return;}
  if(k==="⌫"){pinBuf=pinBuf.slice(0,-1);renderPinDisplay();return;}
  if(pinBuf.length<4) pinBuf+=k;
  renderPinDisplay();
  if(pinBuf.length===4||k==="✓") setTimeout(checkPin,100);
}
function checkPin(){
  if(pinBuf===selUser.pin){
    APP.user=selUser;
    document.getElementById("login-screen").style.display="none";
    document.getElementById("shell").style.display="flex";
    loadApp();
  } else {
    document.getElementById("pin-error").textContent="PIN incorrecto";
    pinBuf=""; renderPinDisplay();
    setTimeout(()=>{document.getElementById("pin-error").textContent="";},2000);
  }
}

// OT DETAIL
async function renderOTDetail(id){
  const ot=APP.data.ots.find(o=>o.id===id);
  if(!ot){toast("OT no encontrada","err");navigate("ots");return;}
  let fases=[],mats=[];
  try{[fases,mats]=await Promise.all([sbGet("ot_fases","ot_id=eq."+id+"&order=orden"),sbGet("ot_materiales","ot_id=eq."+id)]);}catch{}
  const cli=APP.data.clientes.find(c=>c.id===ot.cliente_id);
  const ch=ot.campos_hoja||{};
  const tab=APP.params?.tab||"hoja";
  const activeFase=APP.params?.fase||"premontaje";
  document.getElementById("content").innerHTML=`
  <div class="page-header">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="btn btn-secondary btn-icon" onclick="navigate('ots')">${svgI('<path d="M15 4L8 12l7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',18)}</button>
      <div><div class="page-title">OT-${ot.numero}</div><div class="page-sub">${cli?.nombre||ch.cliente||"Sin cliente"}</div></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      ${statusBadge(ot.estado,OT_ESTADOS)}
      ${isAdmin()?`<select class="form-control" style="width:auto;padding:6px 10px;font-size:12px" onchange="updateOTEstado('${ot.id}',this.value)">
        ${Object.entries(OT_ESTADOS).map(([k,v])=>`<option value="${k}" ${ot.estado===k?"selected":""}>${v.label}</option>`).join("")}
      </select>
      <button class="btn btn-secondary btn-sm" onclick="showEditOTModal('${ot.id}')">✏️ Editar</button>`:""}
    </div>
  </div>
  <div class="card" style="padding:12px;margin-bottom:12px">
    <div class="fase-track">
      ${PHASES.map(p=>{
        const f=fases.find(x=>x.fase===p.id);
        const cls=!f?"":f.estado==="completada"?"done":f.estado==="en_curso"?"active":f.estado==="bloqueada"?"blocked":"";
        return `<div class="fase-step ${cls}" onclick="showFaseModal('${ot.id}','${p.id}')">
          ${p.label}<br><span style="font-size:9px;font-weight:400">${f?.estado||"pendiente"}</span>
        </div>`;}).join("")}
    </div>
  </div>
  <div style="display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px">
    ${[["hoja","📋 Hoja pedido"],["materiales","📦 Materiales"],["resumen","🔩 Resumen"]].map(([t,l])=>`
      <button class="btn btn-ghost" style="border-bottom:2.5px solid ${tab===t?"var(--primary)":"transparent"};border-radius:0;padding:10px 14px;font-size:13px;font-weight:600;color:${tab===t?"var(--primary)":"var(--text3)"};"
        onclick="APP.params.tab='${t}';renderOTDetail('${ot.id}')">${l}</button>`).join("")}
  </div>
  <div id="ot-tab-content"></div>`;
  const tc=document.getElementById("ot-tab-content");
  if(tab==="hoja") renderHojaTab(tc,ot);
  else if(tab==="materiales") renderMaterialesTab(tc,ot,fases,mats,activeFase);
  else if(tab==="resumen") renderResumenTab(tc,mats);
}

function renderHojaTab(tc,ot){
  const ch=ot.campos_hoja||{};
  const ed=isAdmin();
  const fi=(label,id,val,type)=>`<div class="form-group">
    <label class="form-label">${label}</label>
    ${ed?`<input class="form-control" type="${type||"text"}" value="${String(val||"").replace(/"/g,"&quot;")}" onchange="updCh('${ot.id}','${id}',this.value)"/>`
      :`<div style="font-size:14px;color:var(--text);padding:6px 0">${val||"—"}</div>`}
  </div>`;
  tc.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div>
      <div class="form-section">Datos del cliente</div>
      ${fi("Fecha","fecha",ch.fecha,"date")}${fi("Cliente","cliente",ch.cliente)}${fi("OT/Ilave","otIlave",ch.otIlave)}${fi("Contacto","contacto",ch.contacto)}${fi("Oferta","oferta",ch.oferta)}${fi("Teléfono","telefono",ch.telefono)}${fi("Email","email",ch.email)}${fi("Nº Pedido","numeroPedido",ch.numeroPedido)}

function scanHojaForOT(mode){
  const key=localStorage.getItem("foima_anthropic_key")||"";
  if(!key){toast("Configura la API key en Configuración","warn");return;}
  const inp=document.getElementById("scan-input");if(!inp)return;
  if(mode==="camera"){
    inp.setAttribute("capture","environment");
    inp.accept="image/*";
  } else if(mode==="gallery"){
    inp.removeAttribute("capture");
    inp.accept="image/*";
  } else if(mode==="pdf"){
    inp.removeAttribute("capture");
    inp.accept="application/pdf";
  }
  inp.onchange=async function(e){
    const file=e.target.files[0];if(!file)return;
    toast("Analizando con IA...");
    const reader=new FileReader();
    reader.onload=async function(ev){
      const b64=ev.target.result.split(",")[1];
      const mime=file.type||"image/jpeg";
      const campos=await analizarHoja(b64,mime);
      if(campos){
        window._newOTCampos=campos;
        if(campos.otIlave){const m=campos.otIlave.match(/\d{4,}/);if(m)document.getElementById("not-num").value=m[0];}
        if(campos.cliente){
          document.getElementById("not-desc").value=campos.cliente;
          const found=APP.data.clientes.find(c=>c.nombre.toLowerCase().includes(campos.cliente.toLowerCase()));
          if(found)document.getElementById("not-cli").value=found.id;
        }
        const ok=document.getElementById("scan-ok");if(ok)ok.style.display="block";
        toast("Hoja analizada ✓");
      }
    };
    reader.readAsDataURL(file);inp.value="";
  };
  inp.click();
}

function toggleCatFase(faseId){
  const chk=document.getElementById("cat-fase-"+faseId);
  const lbl=document.getElementById("fase-lbl-"+faseId);
  if(!chk||!lbl) return;
  if(chk.checked){lbl.style.borderColor="var(--primary)";lbl.style.background="var(--primary-light)";}
  else{lbl.style.borderColor="var(--border)";lbl.style.background="";}
  const i=window._catFases.indexOf(faseId);
  if(chk.checked&&i===-1) window._catFases.push(faseId);
  else if(!chk.checked&&i>=0) window._catFases.splice(i,1);
}

function showElemSelector(tipo){
  const elems=APP.data.elementos.filter(e=>e.tipo===tipo);
  // If no elements of this type yet, allow creating inline
  const listHtml=elems.length===0
    ?`<div class="empty" style="padding:20px"><div class="empty-icon">📋</div>
       <div class="empty-title">Sin ${tipo} en la lista maestra</div>
       <div class="empty-sub">Ve a la sección Elementos del menú para añadir referencias</div></div>`
    :elems.map(e=>`
      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s"
        onclick="addElemFromMaster(${JSON.stringify(e).replace(/"/g,'&quot;')},'${tipo}')"
        onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''">
        <div style="flex:1">
          <div style="font-family:monospace;font-weight:700;font-size:13px">${e.referencia}</div>

      </div>`).join("");

  // Open a second layer modal (inline div overlay over the current modal)
  const sel=document.createElement("div");
  sel.id="elem-selector-overlay";
  sel.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px";
  sel.innerHTML=`<div style="background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:460px;max-height:80vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)">
    <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
      <div style="font-weight:700;font-size:15px">Seleccionar ${tipo}</div>
      <button class="btn btn-ghost btn-icon" onclick="document.getElementById('elem-selector-overlay').remove()">✕</button>
    </div>
    <div style="padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0">
      <input class="form-control" placeholder="Buscar referencia..." oninput="filterElemSel(this.value,'${tipo}')"/>
    </div>
    <div style="flex:1;overflow-y:auto" id="elem-sel-list">${listHtml}</div>
  </div>`;
  document.body.appendChild(sel);
  sel.addEventListener("click",e=>{if(e.target===sel)sel.remove();});
}

function filterElemSel(q,tipo){
  const elems=APP.data.elementos.filter(e=>e.tipo===tipo&&(!q||e.referencia.toLowerCase().includes(q.toLowerCase())||e.descripcion?.toLowerCase().includes(q.toLowerCase())));
  document.getElementById("elem-sel-list").innerHTML=elems.length===0
    ?`<div style="text-align:center;padding:20px;color:var(--text3)">Sin resultados</div>`
    :elems.map(e=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer"
        onclick="addElemFromMaster(${JSON.stringify(e).replace(/"/g,'&quot;')},'${tipo}')"
        onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''">
        <div style="flex:1"><div style="font-family:monospace;font-weight:700;font-size:13px">${e.referencia}</div>
        <div style="font-size:12px;color:var(--text3)">${e.descripcion||""}</div></div>
        <span style="color:var(--primary);font-size:18px;font-weight:700">+</span>
      </div>`).join("");
}

function addElemFromMaster(elem,tipo){
  // Check not already added
  const exists=window._catElems.find(e=>e.ref===elem.referencia&&e.tipo===tipo);
  if(exists){toast("Ya está añadido","warn");return;}
  window._catElems.push({id:Date.now(),tipo,ref:elem.referencia,desc:elem.descripcion||"",qty:1,elem_id:elem.id});
  renderCatElems();
  document.getElementById("elem-selector-overlay")?.remove();
  toast(elem.referencia+" añadido ✓");
}

function prevCatFoto(url){const p=document.getElementById("cat-foto-prev");if(!p)return;p.innerHTML=url?`<img src="${url}" style="width:100%;height:100%;object-fit:cover"/>`:"📦";}
function catFoto(mode){
  const inp=document.getElementById("cam-input");if(!inp)return;
  if(mode==="camera"){inp.setAttribute("capture","environment");inp.accept="image/*";}
  else if(mode==="gallery"){inp.removeAttribute("capture");inp.accept="image/*";}
  else if(mode==="pdf"){inp.removeAttribute("capture");inp.accept="application/pdf";}
  inp.onchange=function(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(ev){
      document.getElementById("cat-foto-url").value=ev.target.result;
      prevCatFoto(ev.target.result);
    };
    reader.readAsDataURL(file);inp.value="";
  };
  inp.click();
}
function addCatElem(tipo){window._catElems.push({id:Date.now(),tipo,ref:"",desc:"",qty:1});renderCatElems();}
function renderCatElems(){
  const list=document.getElementById("cat-elems-list");if(!list)return;
  if(!window._catElems.length){list.innerHTML=`<div style="color:var(--text3);font-size:13px;text-align:center;padding:12px">Sin elementos. Añade usando los botones de arriba.</div>`;return;}
  const byTipo={};window._catElems.forEach(e=>{if(!byTipo[e.tipo])byTipo[e.tipo]=[];byTipo[e.tipo].push(e);});
  list.innerHTML=Object.entries(byTipo).map(([tipo,items])=>`
    <div style="margin-bottom:12px">
      <div style="font-size:10px;font-weight:700;color:var(--primary);text-transform:uppercase;margin-bottom:6px">${tipo}</div>
      <div class="elem-table">
        <div class="elem-hdr" style="grid-template-columns:110px 1fr 60px 32px"><div>Referencia</div><div>Descripción</div><div style="text-align:right">Cant.</div><div></div></div>
        ${items.map(e=>`
          <div class="elem-row" style="grid-template-columns:110px 1fr 60px 32px">
            <input class="form-control" style="padding:5px 7px;font-size:12px;font-family:monospace" value="${e.ref||""}" placeholder="M8x40" oninput="updCatElem(${e.id},'ref',this.value)"/>
            <input class="form-control" style="padding:5px 7px;font-size:12px" value="${e.desc||""}" placeholder="Descripción" oninput="updCatElem(${e.id},'desc',this.value)"/>
            <input class="form-control" style="padding:5px 7px;font-size:12px;text-align:right" type="number" min="1" value="${e.qty||1}" oninput="updCatElem(${e.id},'qty',Number(this.value))"/>
            <button class="btn btn-ghost btn-icon" style="color:var(--red);padding:4px" onclick="delCatElem(${e.id})">${svgI('<path d="M3 6h18M8 6V4h8v2M5 6v14a2 2 0 002 2h10a2 2 0 002-2V6" stroke="currentColor" stroke-width="1.5"/>',13)}</button>
          </div>`).join("")}
      </div>
    </div>`).join("");
}
function updCatElem(id,field,val){const e=window._catElems.find(x=>x.id===id);if(e)e[field]=val;}
function delCatElem(id){window._catElems=window._catElems.filter(e=>e.id!==id);renderCatElems();}
async function saveCatItem(id){
  const data={codigo:document.getElementById("cat-cod").value.trim(),nombre:document.getElementById("cat-nombre").value.trim(),ref_fabricante:document.getElementById("cat-ref").value.trim(),fases:window._catFases||[],notas:document.getElementById("cat-notas").value,foto_url:document.getElementById("cat-foto-url").value,elementos:window._catElems,updated_at:new Date().toISOString()};
  if(!data.nombre){toast("El nombre es obligatorio","warn");return;}
  try{
    if(id){await sbUpd("catalogo_materiales",id,data);const i=APP.data.catalogo.findIndex(c=>c.id===id);if(i>=0)APP.data.catalogo[i]={...APP.data.catalogo[i],...data};}
    else{const[n]=await sbIns("catalogo_materiales",[{...data,activo:true}]);APP.data.catalogo.unshift(n);}
    toast("Material guardado ✓");closeModal();renderCatalogo();
  }catch(e){toast("Error: "+e.message,"err");}
}
async function deleteCatItem(id){confirm2("¿Eliminar este material del catálogo?",async()=>{try{await sbDel("catalogo_materiales",id);APP.data.catalogo=APP.data.catalogo.filter(c=>c.id!==id);toast("Eliminado");renderCatalogo();}catch(e){toast("Error","err");}});}

async function saveInv(id){
  const data={referencia:document.getElementById("inv-ref").value.trim(),tipo:document.getElementById("inv-tipo").value,descripcion:document.getElementById("inv-desc").value,stock_actual:Number(document.getElementById("inv-stock").value||0),stock_minimo:Number(document.getElementById("inv-min").value||0),unidad:document.getElementById("inv-uni").value||"uds",precio_unitario:Number(document.getElementById("inv-precio").value||0),proveedor:document.getElementById("inv-prov").value,ubicacion:document.getElementById("inv-ubic").value,notas:document.getElementById("inv-notas").value,updated_at:new Date().toISOString()};
  if(!data.referencia){toast("La referencia es obligatoria","warn");return;}
  try{
    if(id){await sbUpd("inventario",id,data);const i=APP.data.inventario.findIndex(x=>x.id===id);if(i>=0)APP.data.inventario[i]={...APP.data.inventario[i],...data};}
    else{const[n]=await sbIns("inventario",[data]);APP.data.inventario.push(n);APP.data.inventario.sort((a,b)=>a.referencia.localeCompare(b.referencia));}
    toast("Guardado ✓");closeModal();renderInventario();
  }catch(e){toast("Error: "+e.message,"err");}
}
async function delInv(id){confirm2("¿Eliminar esta referencia?",async()=>{try{await sbDel("inventario",id);APP.data.inventario=APP.data.inventario.filter(i=>i.id!==id);toast("Eliminado");renderInventario();}catch(e){toast("Error","err");}});}

    <td>${e.descripcion||"—"}</td>
    <td style="font-size:12px">${e.medida||"—"}</td>
    <td style="font-size:12px;color:var(--text3)">${e.material||"—"}</td>
    <td style="font-size:12px;color:var(--text3)">${e.proveedor||"—"}</td>
    ${isAdmin()?`<td>
      <button class="btn btn-ghost btn-icon btn-sm" onclick="showElemModal('${e.id}','${e.tipo}')">✏️</button>
      <button class="btn btn-ghost btn-icon btn-sm" style="color:var(--red)" onclick="delElem('${e.id}')">🗑️</button>
    </td>`:""}
  </tr>`).join("")}
  </tbody></table></div>`;
}

function showElemModal(id=null, tipo=CONSUMIBLE_TIPOS[0]){
  const e=id?APP.data.elementos.find(x=>x.id===id):{};
  const v=k=>String(e?.[k]||"").replace(/"/g,"&quot;");
  openModal(`<div class="overlay"><div class="modal" style="max-width:480px">
    <div class="modal-header"><div class="modal-title">${id?"Editar referencia":"Nueva referencia"}</div><button class="btn btn-ghost btn-icon" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><div class="form-grid form-grid-2">
      <div class="form-group"><label class="form-label">Tipo</label>
        <select class="form-control" id="el-tipo">
          ${CONSUMIBLE_TIPOS.map(t=>`<option value="${t}" ${(e?.tipo||tipo)===t?"selected":""}>${t}</option>`).join("")}
        </select>
      </div>
      <div class="form-group"><label class="form-label">Referencia *</label><input class="form-control" id="el-ref" value="${v("referencia")}" placeholder="M8x40 / RV-1.5 / ..."/></div>
      <div class="form-group" style="grid-column:1/-1"><label class="form-label">Descripción</label><input class="form-control" id="el-desc" value="${v("descripcion")}" placeholder="Tornillo cabeza hexagonal galvanizado"/></div>
      <div class="form-group"><label class="form-label">Medida / Calibre</label><input class="form-control" id="el-medida" value="${v("medida")}" placeholder="M8 · 40mm · 1.5mm²..."/></div>
      <div class="form-group"><label class="form-label">Material</label><input class="form-control" id="el-material" value="${v("material")}" placeholder="Acero inox / Cobre..."/></div>
      <div class="form-group"><label class="form-label">Proveedor</label><input class="form-control" id="el-prov" value="${v("proveedor")}"/></div>
      <div class="form-group"><label class="form-label">Referencia proveedor</label><input class="form-control" id="el-refprov" value="${v("ref_proveedor")}"/></div>
      <div class="form-group" style="grid-column:1/-1"><label class="form-label">Notas</label><textarea class="form-control" id="el-notas">${e?.notas||""}</textarea></div>
    </div></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveElem('${id||""}')">${id?"Guardar":"Crear"}</button>
    </div>
  </div></div>`);
}

async function saveElem(id){
  const data={tipo:document.getElementById("el-tipo").value,referencia:document.getElementById("el-ref").value.trim(),descripcion:document.getElementById("el-desc").value,medida:document.getElementById("el-medida").value,material:document.getElementById("el-material").value,proveedor:document.getElementById("el-prov").value,ref_proveedor:document.getElementById("el-refprov").value,notas:document.getElementById("el-notas").value,updated_at:new Date().toISOString()};
  if(!data.referencia){toast("La referencia es obligatoria","warn");return;}
  try{
    if(id){
      await sbUpd("elementos_maestros",id,data);
      const i=APP.data.elementos.findIndex(e=>e.id===id);
      if(i>=0)APP.data.elementos[i]={...APP.data.elementos[i],...data};
    } else {
      const[n]=await sbIns("elementos_maestros",[data]);
      APP.data.elementos.push(n);
      APP.data.elementos.sort((a,b)=>a.referencia.localeCompare(b.referencia));
    }
    toast("Guardado ✓");closeModal();renderElementos();
  }catch(e){toast("Error: "+e.message,"err");}
}

async function delElem(id){
  confirm2("¿Eliminar esta referencia?",async()=>{
    try{await sbDel("elementos_maestros",id);APP.data.elementos=APP.data.elementos.filter(e=>e.id!==id);toast("Eliminado");renderElementos();}
    catch(e){toast("Error","err");}
  });
}

// INFORMES
function renderInformes(){
  const {ots,facturas,clientes}=APP.data;
  const porEstado={};ots.forEach(o=>{porEstado[o.estado]=(porEstado[o.estado]||0)+1;});
  const now=new Date();
  const facMes=facturas.filter(f=>{if(f.estado!=="cobrada")return false;const d=new Date(f.fecha||f.created_at);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();}).reduce((s,f)=>s+Number(f.total||0),0);
  const top5=clientes.map(c=>({nombre:c.nombre,ots:ots.filter(o=>o.cliente_id===c.id).length,fact:facturas.filter(f=>f.cliente_id===c.id&&f.estado==="cobrada").reduce((s,f)=>s+Number(f.total||0),0)})).sort((a,b)=>b.fact-a.fact).slice(0,5);
  document.getElementById("content").innerHTML=`
  <div class="page-header"><div class="page-title">Estadísticas</div></div>
  <div class="stats-grid">
    <div class="stat-card" style="border-color:var(--primary)"><div class="stat-num" style="color:var(--primary)">${ots.length}</div><div class="stat-label">OTs totales</div></div>
    <div class="stat-card" style="border-color:var(--green)"><div class="stat-num" style="color:var(--green);font-size:18px">${fmtMoney(facMes)}</div><div class="stat-label">Facturado este mes</div></div>
    <div class="stat-card"><div class="stat-num">${clientes.length}</div><div class="stat-label">Clientes</div></div>
    <div class="stat-card" style="border-color:var(--red)"><div class="stat-num" style="color:var(--red)">${ots.filter(o=>o.prioridad==="urgente").length}</div><div class="stat-label">OTs urgentes</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div class="card">
      <div class="card-title">OTs por estado</div>
      ${Object.entries(OT_ESTADOS).map(([k,v])=>{const n=porEstado[k]||0;const pct=ots.length?Math.round(n/ots.length*100):0;
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${statusBadge(k,OT_ESTADOS)}</span><span style="font-weight:700">${n} (${pct}%)</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:var(--primary)"></div></div>
        </div>`;}).join("")}
    </div>
    <div class="card">
      <div class="card-title">Top 5 clientes por facturación</div>
      ${top5.length===0?`<div class="empty" style="padding:20px"><div class="empty-title">Sin datos</div></div>`:
      top5.map((c,i)=>`
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</div>
          <div style="flex:1"><div style="font-weight:600;font-size:13px">${c.nombre}</div><div style="font-size:11px;color:var(--text3)">${c.ots} OTs</div></div>
          <div style="font-weight:700;font-size:13px">${fmtMoney(c.fact)}</div>
        </div>`).join("")}
    </div>
  </div>`;
}

// CONFIG

  const key=localStorage.getItem("foima_anthropic_key")||"";
  document.getElementById("content").innerHTML=`
  <div class="page-header"><div class="page-title">Configuración</div></div>
  <div class="card">
    <div class="card-title">API de Anthropic (escáner de hojas)</div>
    <div class="form-group">
      <label class="form-label">API Key</label>
      <input class="form-control" type="password" id="cfg-key" value="${key}" placeholder="sk-ant-..."/>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">Obtén tu key en console.anthropic.com → API Keys. Coste aproximado 0.003€/hoja escaneada.</div>
    </div>
    <button class="btn btn-primary" onclick="saveCfg()">Guardar configuración</button>
  </div>
  ${isAdmin()?`<div class="card">
    <div class="card-title">Usuarios</div>
    <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>PIN</th><th>Rol</th><th></th></tr></thead><tbody>
    ${APP.data.usuarios.map(u=>`<tr>
      <td class="td-main">${u.nombre}</td>
      <td style="font-family:monospace">••••</td>
      <td>${u.rol==="admin"?`<span class="badge badge-amber">Admin</span>`:`<span class="badge badge-gray">Viewer</span>`}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="showUsrModal('${u.id}')">✏️</button></td>
    </tr>`).join("")}
    </tbody></table></div>
    <button class="btn btn-secondary" style="margin-top:10px" onclick="showUsrModal()">+ Nuevo usuario</button>
  </div>`:""}
  <div class="card">
    <div class="card-title">Base de datos Supabase</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:10px">Conectado a ${SB_URL}</div>
    <button class="btn btn-secondary" onclick="reloadData()">🔄 Recargar datos</button>
  </div>`;
}
async function saveCfg(){
  const key=document.getElementById("cfg-key").value.trim();
  localStorage.setItem("foima_anthropic_key",key);
  // Also persist to Supabase so it survives on all devices
  try{
    const existing=await sbGet("configuracion","clave=eq.anthropic_key");
    if(existing.length>0){await sbUpd("configuracion",existing[0].id,{valor:key});}
    else{await sbIns("configuracion",[{clave:"anthropic_key",valor:key}]);}
    toast("Configuración guardada en todos los dispositivos ✓");
  }catch{
    toast("Guardado localmente ✓ (sin sync a BD)");
  }
}
async function loadAnthropicKey(){
  try{
    const rows=await sbGet("configuracion","clave=eq.anthropic_key");
    if(rows.length>0&&rows[0].valor){
      localStorage.setItem("foima_anthropic_key",rows[0].valor);
      return rows[0].valor;
    }
  }catch{}
  return localStorage.getItem("foima_anthropic_key")||"";
}
async function reloadData(){toast("Recargando...");await loadAllData();toast("Datos actualizados ✓");}

function showUsrModal(id=null){
  const u=id?APP.data.usuarios.find(x=>x.id===id):{};
  openModal(`<div class="overlay"><div class="modal" style="max-width:360px">
    <div class="modal-header"><div class="modal-title">${id?"Editar usuario":"Nuevo usuario"}</div><button class="btn btn-ghost btn-icon" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Nombre *</label><input class="form-control" id="usr-n" value="${u?.nombre||""}"/></div>
      <div class="form-group"><label class="form-label">PIN (4 dígitos)</label><input class="form-control" id="usr-p" type="password" maxlength="4" placeholder="••••"/></div>
      <div class="form-group"><label class="form-label">Rol</label>
        <select class="form-control" id="usr-r">
          <option value="viewer" ${u?.rol==="viewer"?"selected":""}>Viewer (solo lectura)</option>
          <option value="admin" ${u?.rol==="admin"?"selected":""}>Admin (edición completa)</option>
        </select>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveUsr('${id||""}')">${id?"Guardar":"Crear"}</button></div>
  </div></div>`);
}
async function saveUsr(id){
  const nombre=document.getElementById("usr-n").value.trim();const pin=document.getElementById("usr-p").value;const rol=document.getElementById("usr-r").value;
  if(!nombre){toast("El nombre es obligatorio","warn");return;}
  const data={nombre,rol};if(pin)data.pin=pin;
  try{
    if(id){await sbUpd("usuarios",id,data);const i=APP.data.usuarios.findIndex(u=>u.id===id);if(i>=0)APP.data.usuarios[i]={...APP.data.usuarios[i],...data};}
    else{if(!pin||pin.length!==4){toast("El PIN debe tener 4 dígitos","warn");return;}const[n]=await sbIns("usuarios",[{...data,activo:true}]);APP.data.usuarios.push(n);}
    toast("Usuario guardado ✓");closeModal();renderConfig();
  }catch(e){toast("Error: "+e.message,"err");}
}

// CLAUDE VISION
async function analizarHoja(b64,mime){
  const key=localStorage.getItem("foima_anthropic_key")||"";
  if(!key){toast("Configura la API key en Configuración","warn");return null;}
  const campos=["fecha","revision","cliente","otIlave","contacto","oferta","telefono","email","numeroPedido","marcaModelo","bastidor","dee","voltaje","fechaLleg","equipo","tipoCarro","dimPlat","tipoSusp","cajasHerr","bidon","extintor","modeloCabr","montajeCabr","pintCabina","pintCarro","pintSch","grupo","ptoBomba","telemando","rotativo","textoSenal","fijacion","trilogy","tomaBat","focos","enganche","pina","bArrastre","soporteConos","barraMotos","calzos","tresEje","garras","carroMotos","gato","lucesMag","polea","soporteGato","eslingas","carrosSop","visera","obs1","obs2","obsLibre","comercial","revisadoPor","aprobadoPor","plazo"];
  const prompt=`Analiza esta hoja de pedido FOIMA (FO-023) y extrae todos los campos visibles.\nDevuelve ÚNICAMENTE un JSON válido con estos campos (vacío "" si no se ve):\n${campos.map(f=>'"'+f+'"').join(", ")}\nSOLO JSON, sin texto adicional ni markdown.`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mime,data:b64}},{type:"text",text:prompt}]}]})});
    if(!res.ok){const e=await res.json();toast("Error API: "+(e.error?.message||res.status),"err");return null;}
    const data=await res.json();const text=data.content?.[0]?.text||"";
    return JSON.parse(text.replace(/```json|```/g,"").trim());
  }catch(e){toast("Error al analizar: "+e.message,"err");return null;}
}
